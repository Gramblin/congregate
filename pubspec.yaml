  flutter_map: ^8.1.1
  flutter_material_design_icons: ^3.1.0+7447
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  geolocator: ^13.0.4
  go_router: ^16.3.0
  go_router_builder: ^4.1.1
